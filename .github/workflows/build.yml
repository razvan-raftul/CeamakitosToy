name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64 -DTOY_VERSION=0.1.${{ github.run_number }}

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern ' error |error C|error LNK|fatal error' | Select-Object -First 40 | ForEach-Object { Write-Output ("::error::" + $_.Line.Trim()) }
            exit 1
          }

      - name: NVDA controller client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path nvda | Out-Null
          try {
            Invoke-WebRequest -Uri "https://download.nvaccess.org/releases/2024.4.1/nvda_2024.4.1_controllerClient.zip" -OutFile nvda/cc.zip
            Expand-Archive nvda/cc.zip -DestinationPath nvda/x -Force
            $dll = Get-ChildItem -Recurse nvda/x -Filter "nvdaControllerClient*.dll" | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
            Copy-Item $dll.FullName "nvda/nvdaControllerClient.dll"
            Get-ChildItem -Recurse nvda/x | Select-Object FullName
          } catch { Write-Output "::warning::Nu am putut lua nvdaControllerClient: $_" }
          if (-not (Test-Path "nvda/nvdaControllerClient.dll")) { New-Item nvda/lipsa.txt -ItemType File | Out-Null }

      - name: Installer
        shell: pwsh
        env:
          VER: 0.1.${{ github.run_number }}
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::Inno Setup a esuat"; exit 1 }
          Get-ChildItem out

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Ceamakito's toy 0.1.${{ github.run_number }}
          files: out/*.exe
