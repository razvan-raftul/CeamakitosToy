name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern ' error |error C|error LNK|fatal error' | Select-Object -First 40 | ForEach-Object { Write-Output ("::error::" + $_.Line.Trim()) }
            exit 1
          }

      - name: Package
        shell: pwsh
        run: |
          $out = "pachet/Ceamakito's toy"
          New-Item -ItemType Directory -Force -Path "$out/VST3" | Out-Null
          Copy-Item -Recurse "build/CeamakitosToy_artefacts/Release/VST3/*" "$out/VST3/"
          New-Item -ItemType Directory -Force -Path "$out/REAPER" | Out-Null
          Copy-Item -Recurse "reaper/*" "$out/REAPER/"
          Copy-Item "CITESTE-MA.txt" "$out/"
          Compress-Archive -Path "pachet/*" -DestinationPath "CeamakitosToy.zip" -Force
          Get-ChildItem -Recurse pachet | Select-Object FullName

      - uses: actions/upload-artifact@v4
        with:
          name: CeamakitosToy
          path: CeamakitosToy.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Ceamakito's toy 0.1.${{ github.run_number }}
          files: CeamakitosToy.zip
